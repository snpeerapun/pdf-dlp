[package]
name = "pdf-dlp"
version = "0.1.0"
description = "PDF DLP — PDF tools + data classification, all on-device"
authors = ["oneable"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "pdf_dlp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
lopdf = { version = "0.46", features = ["embed_image"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
image = "0.25"
regex = "1.13.1"
base64 = "0.23.1"
rand = "0.10.3"
csv = "1.4.0"
chrono = "0.4.45"
tauri-plugin-single-instance = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
