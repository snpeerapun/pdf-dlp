name: build-native
on:
  push: { branches: [main], tags: ['v*'] }
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: jurplel/install-qt-action@v4
        with: { version: '6.8.*', modules: '', cache: true }
      - name: PDFium prebuilt
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x64.tgz -OutFile pdfium.tgz
          New-Item -ItemType Directory -Force cpp/pdfium | Out-Null
          tar -xzf pdfium.tgz -C cpp/pdfium
      - name: Rust core
        run: cargo build --release --manifest-path core-ffi/Cargo.toml
      - name: Configure & build
        shell: pwsh
        run: |
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release -DPDFCORE_LIB="$PWD/core-ffi/target/release/pdfcore.lib"
          cmake --build cpp/build --config Release
      - name: Package
        shell: pwsh
        run: |
          $out = "dist/PDF-DLP-win64"; New-Item -ItemType Directory -Force "$out/fonts" | Out-Null
          Copy-Item cpp/build/Release/pdfdlp.exe "$out/PDF DLP.exe"
          Copy-Item cpp/pdfium/bin/pdfium.dll $out/
          Copy-Item cpp/assets/fonts/* "$out/fonts/"; Copy-Item cpp/src/theme.qss $out/
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations "$out/PDF DLP.exe"
          Compress-Archive -Path $out -DestinationPath dist/PDF-DLP-win64.zip
      - uses: actions/upload-artifact@v4
        with: { name: PDF-DLP-win64, path: dist/PDF-DLP-win64.zip }
