name: build-native
on:
  push: { branches: [main], tags: ['v*'] }
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: jurplel/install-qt-action@v4
        with: { version: '6.8.*', modules: '', cache: true }
      - name: PDFium prebuilt
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x64.tgz -OutFile pdfium.tgz
          New-Item -ItemType Directory -Force cpp/pdfium | Out-Null
          tar -xzf pdfium.tgz -C cpp/pdfium
      - name: Rust core
        run: cargo build --release --manifest-path core-ffi/Cargo.toml
      - name: Configure & build
        shell: pwsh
        run: |
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release -DPDFCORE_LIB="$PWD/core-ffi/target/release/pdfcore.lib"
          cmake --build cpp/build --config Release
      - name: Package (portable folder)
        shell: pwsh
        run: |
          $out = "cpp/dist/PDF-DLP-win64"; New-Item -ItemType Directory -Force "$out/fonts/edit" | Out-Null
          Copy-Item "cpp/build/Release/PDF DLP.exe" "$out/PDF DLP.exe"
          Copy-Item cpp/pdfium/bin/pdfium.dll $out/
          Copy-Item cpp/assets/fonts/*.ttf,cpp/assets/fonts/*.otf "$out/fonts/"; Copy-Item cpp/assets/fonts/edit/* "$out/fonts/edit/"; Copy-Item cpp/src/theme.qss $out/
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations "$out/PDF DLP.exe"
          Compress-Archive -Path $out -DestinationPath cpp/dist/PDF-DLP-win64-portable.zip
      - name: Installer (Inno Setup wizard)
        shell: pwsh
        run: |
          $ver = (Select-String -Path cpp/CMakeLists.txt -Pattern 'MACOSX_BUNDLE_SHORT_VERSION_STRING "([0-9.]+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$ver cpp/installer/pdfdlp.iss
          Get-ChildItem cpp/dist
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-DLP-windows
          path: |
            cpp/dist/PDF-DLP-Setup-*.exe
            cpp/dist/PDF-DLP-win64-portable.zip
      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cpp/dist/PDF-DLP-Setup-*.exe
            cpp/dist/PDF-DLP-win64-portable.zip
