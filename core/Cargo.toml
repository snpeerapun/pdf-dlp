[package]
name = "pdfcore"
version = "0.1.0"
edition = "2024"

[dependencies]
lopdf = { version = "0.46", features = ["embed_image"] }
image = "0.25"
regex = "1"
base64 = "0.23"
rand = "0.10"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
